name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q GroqChatApp.zip
      - name: Build
        working-directory: GroqChatApp
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GroqChat-debug-apk
          path: GroqChatApp/app/build/outputs/apk/debug/app-debug.apk
          
